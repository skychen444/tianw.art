<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Noise Portrait — Tian W.</title>
  <link rel="stylesheet" href="style.css?v=20261118-core">
  <link rel="stylesheet" href="css/noise-portrait.css?v=20261121-v19">
</head>

<body class="dark-page noise-portrait-page">
  <header class="site-header">
    <a class="site-name" href="index.html">Tian W.</a>
    <nav class="site-nav">
      <a class="active" href="works.html">Works</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="noise-main">
    <section class="noise-hero">
      <div class="noise-title-block">
        <h1>Noise Portrait</h1>
        <p class="noise-meta">2026<br>Generative image</p>
      </div>

      <div class="noise-exhibition-view" aria-label="Noise Portrait exhibition-style presentation">
        <figure class="noise-artwork">
          <img
            src="assets/noise-portrait/noise-portrait-final-b.webp"
            alt="Noise Portrait, a smoking figure dissolving into coloured algorithmic strokes"
          >
        </figure>

        <figure class="noise-label" tabindex="0" role="button" aria-label="Enlarge Noise Portrait exhibition label" aria-expanded="false">
          <img
            src="assets/noise-portrait/noise-portrait-exhibition-label.webp"
            alt="Noise Portrait exhibition label"
          >
        </figure>
      </div>
    </section>

    <section class="noise-statement" aria-label="Artist statement">
      <span class="noise-statement-line noise-statement-line-left" aria-hidden="true"></span>
      <p>Smoke becomes a stroke between me and reality.</p>
      <span class="noise-statement-line noise-statement-line-right" aria-hidden="true"></span>
    </section>

    <section class="noise-transform" aria-label="Noise Portrait transformation">
      <div class="noise-transform-sticky">
        <div class="noise-transform-frame">
          <img class="noise-transform-image is-active" src="assets/noise-portrait/noise-portrait-stage-a.webp" alt="">
          <img class="noise-transform-image" src="assets/noise-portrait/noise-portrait-stage-b.webp" alt="">
          <img class="noise-transform-image" src="assets/noise-portrait/noise-portrait-stage-c.webp" alt="">
          <img class="noise-transform-image" src="assets/noise-portrait/noise-portrait-final-a.webp" alt="">
          <img class="noise-transform-image" src="assets/noise-portrait/noise-portrait-final-b.webp" alt="Noise Portrait transformation from low noise to final image">
        </div>
      </div>
    </section>

    <a class="back-link noise-back-link" href="works.html">Back to Works</a>
  </main>

  <script>
    const header = document.querySelector('.site-header');
    addEventListener('scroll', () => {
      header.classList.toggle('header-hidden', scrollY > 70);
    }, { passive: true });

    const label = document.querySelector('.noise-label');

    const setLabelExpanded = (expanded) => {
      label.classList.toggle('is-expanded', expanded);
      label.setAttribute('aria-expanded', String(expanded));
    };

    label.addEventListener('click', (event) => {
      if (matchMedia('(hover: hover) and (pointer: fine)').matches) return;
      event.stopPropagation();
      setLabelExpanded(!label.classList.contains('is-expanded'));
    });

    label.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        setLabelExpanded(!label.classList.contains('is-expanded'));
      } else if (event.key === 'Escape') {
        setLabelExpanded(false);
      }
    });

    document.addEventListener('click', () => {
      if (!matchMedia('(hover: hover) and (pointer: fine)').matches) {
        setLabelExpanded(false);
      }
    });

    const transformSection = document.querySelector('.noise-transform');
    const transformFrame = document.querySelector('.noise-transform-frame');
    const transformImages = [...document.querySelectorAll('.noise-transform-image')];
    const finePointer = matchMedia('(hover: hover) and (pointer: fine)');
    let transformIndex = 0;
    let wheelAccumulator = 0;
    let wheelReleaseTimer = 0;

    const renderTransformIndex = (index) => {
      transformIndex = Math.max(0, Math.min(transformImages.length - 1, index));
      transformImages.forEach((image, imageIndex) => {
        image.style.opacity = imageIndex === transformIndex ? '1' : '0';
      });
    };

    const transformIsActive = () => {
      if (!transformFrame || !finePointer.matches) return false;

      const frameRect = transformFrame.getBoundingClientRect();
      const fullyVisible =
        frameRect.top >= 0 &&
        frameRect.bottom <= innerHeight;

      return fullyVisible;
    };

    const releaseWheelAccumulator = () => {
      clearTimeout(wheelReleaseTimer);
      wheelReleaseTimer = setTimeout(() => {
        wheelAccumulator = 0;
      }, 140);
    };

    const onTransformWheel = (event) => {
      if (!finePointer.matches || !transformIsActive() || transformImages.length === 0) return;

      const direction = Math.sign(event.deltaY);
      if (direction === 0) return;

      const atFirst = transformIndex === 0;
      const atLast = transformIndex === transformImages.length - 1;

      if (direction < 0 && atFirst) {
        wheelAccumulator = 0;
        return;
      }

      if (direction > 0 && atLast) {
        wheelAccumulator = 0;
        return;
      }

      event.preventDefault();

      wheelAccumulator += event.deltaY;
      releaseWheelAccumulator();

      const threshold = 36;
      if (Math.abs(wheelAccumulator) < threshold) return;

      renderTransformIndex(
        transformIndex + (wheelAccumulator > 0 ? 1 : -1)
      );

      wheelAccumulator = 0;
    };

    const updateTouchTransform = () => {
      if (finePointer.matches || !transformSection || transformImages.length === 0) return;

      const rect = transformSection.getBoundingClientRect();
      const scrollable = Math.max(1, transformSection.offsetHeight - innerHeight);
      const travelled = Math.min(scrollable, Math.max(0, -rect.top));
      const progress = travelled / scrollable;
      const scaled = progress * (transformImages.length - 1);

      transformImages.forEach((image, index) => {
        const opacity = Math.max(0, 1 - Math.abs(scaled - index));
        image.style.opacity = opacity.toFixed(3);
      });
    };

    renderTransformIndex(0);
    updateTouchTransform();

    addEventListener('scroll', updateTouchTransform, { passive: true });
    addEventListener('resize', updateTouchTransform);
    addEventListener('wheel', onTransformWheel, { passive: false });
  </script>
</body>
</html>
